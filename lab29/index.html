<!DOCTYPE html>
<html lang="uk">

<head>

    <title>Лабораторна робота</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        input {
            padding: 5px;
            width: 250px;
        }

        button {
            padding: 5px 10px;
            margin-left: 5px;
            cursor: pointer;
        }

        li {
            margin: 10px 0;
        }

<body>

    <h1>Лабораторна робота</h1>
